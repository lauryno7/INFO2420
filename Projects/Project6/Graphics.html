<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Backyard Birds - Graphics</title>
<style>
body {
    background-color: #055B7C;
    background-image: url('Images/2colback.jpg');
    background-repeat: repeat-y;
}
#thumbs, #image {
    width: 700px;
    text-align: center;
    margin: 0 auto 0 auto;
    color: #000;
    background: #eee;
    border: solid 1px #000;
    padding: 5px;
}
#thumbs {
    margin-top: 10px;
}
#thumbs img {
    border: solid 1px #000;
    margin: 5px;
    cursor: pointer;
}
#image {
    height: 400px;
}
.instructions {
    font-style: italic;
}
.center {
    text-align: center;
}
</style>
<script>
var PrintButton1 = new Image();
var PrintButton2 = new Image();
var logo1 = new Image();
var logo2 = new Image();
if (document.images) {
    PrintButton1.src = "Images/print1.jpg";
    PrintButton2.src = "Images/print2.jpg";
    logo1.src = "Images/Logo1.png";
    logo2.src = "Images/Logo2.jpg";
}

// Update these arrays with your own images and titles
var imgArray = [
    'BaldEagleSm.jpg',
    'CardinalSmall.jpg',
    'GeeseSmall.jpg',
    'HawkSm.jpg'
];
var titleArray = [
    'Bald Eagle',
    'Cardinal',
    'Geese',
    'Hawk'
];
var imgPath = "Images/";

function swapImage(imgID) {
    var theImage = document.getElementById('theImage');
    var textDiv = document.getElementById('bottomText');
    theImage.src = imgPath + imgArray[imgID];
    textDiv.innerHTML = titleArray[imgID];
}
function preloadImages() {
    for(var i = 0; i < imgArray.length; i++) {
        var tmpImg = new Image();
        tmpImg.src = imgPath + imgArray[i];
    }
}
</script>
</head>
<body onload="preloadImages()">

<div class="center">
    <a href="" onmouseover="document.PrintButton.src=PrintButton2.src;"
       onmouseout="document.PrintButton.src=PrintButton1.src;">
        <img src="Images/print1.jpg" width="200" height="50"
             name="PrintButton" alt="Print Page" style="border:none;">
    </a>
</div>

<div id="logo" class="center">
    <a href="logo.html" onmouseover="document.logo.src=logo2.src;"
       onmouseout="document.logo.src=logo1.src;">
        <img src="Images/Logo1.png" width="150" height="150"
             name="logo" alt="Logo" style="border:none;">
    </a>
</div>

<br><br><br>

<div id="thumbs">
    <img src="Images/BaldEagleSm.jpg" alt="Bald Eagle" onmouseover="swapImage(0);">
    <img src="Images/CardinalSmall.jpg" alt="Cardinal" onmouseover="swapImage(1);">
    <img src="Images/GeeseSmall.jpg" alt="Geese" onmouseover="swapImage(2);">
    <img src="Images/HawkSm.jpg" alt="Hawk" onmouseover="swapImage(3);">
</div>

<div id="image">
    <img id="theImage" src="Images/BaldEagleSm.jpg" alt="Bald Eagle">
    <h3 id="bottomText">Bald Eagle</h3>
</div>

</body>
</html>
